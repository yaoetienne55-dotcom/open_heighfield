
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://api.muapi.ai;
        proxy_ssl_server_name on;

        proxy_set_header Host api.muapi.ai;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
